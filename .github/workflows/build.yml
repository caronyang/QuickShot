name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/QuickShot/QuickShot.csproj -c Release -v:m

      - name: Publish the self-contained single exe
        run: >
          dotnet publish src/QuickShot/QuickShot.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          & $iscc "/DPublishDir=$PWD\dist" "$PWD\installer\QuickShot.iss"

      - name: Upload the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-portable-x64
          path: dist/QuickShot.exe
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-setup
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Attach the binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QuickShot $tag" --generate-notes
          }
          gh release upload $tag dist/QuickShot.exe --clobber
          gh release upload $tag (Get-ChildItem build/installer/QuickShot-Setup-*.exe).FullName --clobber
