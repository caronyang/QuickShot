name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/QuickShot/QuickShot.csproj -c Release -v:m

      - name: Publish the self-contained single exe
        run: >
          dotnet publish src/QuickShot/QuickShot.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          $isccArgs = @()
          # Inno Setup 6.5+ no longer bundles the unofficial translations; only add the
          # Traditional Chinese installer UI when the language file is present.
          if (Test-Path (Join-Path (Split-Path -Parent $iscc) 'Languages\ChineseTrad.isl')) {
            $isccArgs += '/DUseChineseTrad'
          }
          $isccArgs += "/DPublishDir=$((Resolve-Path dist).Path)"
          $isccArgs += (Resolve-Path installer/QuickShot.iss).Path
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Name the portable exe after the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Copy-Item dist/QuickShot.exe "dist/QuickShot-$version-portable-x64.exe"

      - name: Upload the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-portable-x64
          path: dist/QuickShot.exe
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-setup
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Attach the binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title "QuickShot $tag" --generate-notes
          }
          # Never replace an asset that is already attached (a release may have been
          # published locally first, e.g. with an installer the runner cannot build).
          $existing = @(gh release view $tag --json assets --jq '.assets[].name')
          # Only the versioned portable name for tags (the upload step renames it), plus the
          # installer. dist\QuickShot.exe itself would be a duplicate of the renamed copy.
          $files = @(Get-ChildItem 'dist\QuickShot-*-portable-x64.exe', 'build\installer\QuickShot-Setup-*.exe' -ErrorAction SilentlyContinue)
          foreach ($file in $files) {
            $name = Split-Path $file.FullName -Leaf
            if ($existing -contains $name) { Write-Host "skip $name (already attached)" }
            else { gh release upload $tag $file.FullName }
          }
